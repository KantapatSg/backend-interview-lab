name: backend-interview-lab

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: interview_lab
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d interview_lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrations are an explicit one-shot step. Keeping them out of
  # docker-entrypoint-initdb.d means an existing volume cannot silently skip
  # a schema change just because PostgreSQL was initialized earlier.
  migrate:
    image: postgres:16.4
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: interview_lab
    volumes:
      - ./platform/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql -v ON_ERROR_STOP=1 -f /migrations/001_init.sql"]

  kafka:
    image: apache/kafka:3.8.1
    profiles: [eventing, full]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    profiles: [eventing, full]
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    volumes: ["./infra/kafka/init-topics.sh:/scripts/init-topics.sh:ro"]

  redis:
    image: redis:7.4.1-alpine
    profiles: [cache, full]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    profiles: [app, full]
    command: ["/api"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/interview_lab?sslmode=disable
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    profiles: [eventing, full]
    command: ["/worker"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/interview_lab?sslmode=disable
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: jobs.events.v1
      OUTBOX_POLL_MS: "500"
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}

  web:
    build: ./platform/web
    profiles: [app, full]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_started}

volumes:
  postgres-data:
